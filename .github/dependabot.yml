# Dependency updates.
#
# Everything in this repository drifted a long way before this file
# existed — several majors behind across both workspaces — because
# nothing was watching. Weekly, grouped, and deliberately quiet:
# routine minor and patch bumps arrive as one pull request per
# workspace, while majors come individually because each needs a
# migration pass and reviewing them batched is how they get rubber
# stamped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: ["dependencies", "server"]
    groups:
      server-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # @types/node must track the Node major the app actually runs on
      # (engines >=22, and the image is node:22-alpine). A newer line
      # types APIs the runtime does not have, so the compiler stops
      # catching real mistakes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks typescript-eslint outright — it refuses to
      # load, so linting stops entirely in both workspaces. The peer
      # range is >=4.8.4 <6.1.0, so 6.x is the ceiling until
      # typescript-eslint/typescript-eslint#10940 lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pg-boss 12 cannot migrate an existing schema — it refuses
      # anything below version 25, and 11 fails from 24 as well. The
      # upgrade needs DROP SCHEMA pgboss CASCADE on every environment;
      # DEPLOYMENT.md carries the procedure.
      #
      # This one is held for a sharper reason than the others: no test
      # starts the scheduler, so CI passes on a pg-boss bump and the
      # breakage appears only in production, quietly, as reminders that
      # stop arriving. A green tick would be actively misleading here.
      - dependency-name: "pg-boss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
    groups:
      web-routine:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Same TypeScript 7 blocker as the server workspace.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The runtime image. A base image left alone is where CVEs accumulate
  # quietly, since nothing in the npm tree reports them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    labels: ["dependencies", "docker"]
    ignore:
      # Patch and minor bumps of node:22-alpine are welcome; a major is
      # not, on its own. @types/node is pinned to the 22 line precisely
      # because the runtime is Node 22, so moving the image alone would
      # leave the compiler describing a different runtime from the one
      # the code runs on. Move the image and @types/node together, or
      # neither.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ci.yml pins actions by major tag; this keeps those current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Istanbul
    labels: ["dependencies", "ci"]
